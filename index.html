</style></head><body><header><div><div class="brand">▣ 의사소통</div><div class="sub">교과 수업을 함께하는 의사소통북 · 학교 공통자료 2.0</div></div><div class="row"><button id="back" type="button" disabled>← 뒤로가기</button><button id="home">처음으로</button><button id="basket">인쇄함 <b>0</b></button><button id="sync">최신 자료 받기</button><button id="teacher">자료 제작</button><button id="install" hidden>앱 설치</button><button id="refresh" hidden>앱 업데이트</button><button id="data">공유·사용안내</button></div></header><div class="status" id="status" role="status" aria-live="polite">자료를 불러오는 중입니다.</div><main><nav aria-label="현재 위치" id="crumb"></nav><h1 id="title"></h1><p id="intro"></p><div id="tools" class="toolbar"></div><div id="content"></div></main><footer>GitHub 학교 공통자료 · 인터넷 연결 시 최신 자료 확인 · 오프라인에서는 마지막 저장 자료 사용</footer><dialog id="dialog"></dialog><div id="print-area"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);const stages=[['초등',6],['중등',3],['고등',3],['전공과',2]];let db,state,path=[],mode='tablet',manage=false,selected=new Set(),teacher=false,commonData,localDraft=null,installPrompt=null,syncing=false;
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function initial(){return{schema:1,subjects:[],units:[],cards:[]}}
function notify(s,error=false){$('#status').textContent=s;$('#status').className='status'+(error?' alert':'')}
function btn(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=()=>Promise.resolve().then(fn).catch(e=>notify(e.message,true));return b}
function element(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('school-aac-web-v2',1);q.onupgradeneeded=()=>q.result.createObjectStore('data');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function read(){return new Promise((resolve,reject)=>{const q=db.transaction('data').objectStore('data').get('state');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function write(next){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(next,'state');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('저장 실패'))})}
async function commit(next){if(!teacher)throw Error('자료 제작 모드에서 편집해 주세요.');validateBackup(next);await writeKey('draft',next);localDraft=next;state=next;notify('이 컴퓨터에 작업을 저장했습니다. 공통 반영은 common.json을 GitHub에 게시해야 합니다.');render()}
function navigate(v){path.push(v);manage=false;render()}
function matchingSubject(s){return s.stage===path[0]&&s.grade===path[1]}
function subjects(){const custom=state.subjects.filter(matchingSubject);const low=path[0]==='초등'&&Number(path[1])<=2;const names=path[0]==='초등'?(low?['국어','수학','통합']:['국어','사회','수학','과학','음악','미술','체육']):[];return[...new Set([...names,...custom.map(s=>s.name)])]}
function currentUnits(){return state.units.filter(u=>u.stage===path[0]&&u.grade===path[1]&&u.subject===path[2])}
function currentCards(){return state.cards.filter(c=>c.unit===path[3])}
function tile(label,detail,fn){const b=btn('',fn,'tile');b.append(element('strong',label));if(detail)b.append(element('small',detail));return b}
function render(){$('#teacher').textContent=teacher?'공통자료로 돌아가기':'자료 제작';$('#data').textContent=teacher?'게시·백업':'공유·사용안내';$('#back').disabled=path.length===0;const crumbs=$('#crumb');crumbs.replaceChildren();['처음',...path.map((p,i)=>i===1?p+'학년':i===3?(state.units.find(u=>u.id===p)?.name||'단원'):p)].forEach((s,i)=>{if(i)crumbs.append(element('span','›'));crumbs.append(btn(s,()=>{path=path.slice(0,i);manage=false;render()}))});$('#basket b').textContent=selected.size;const tools=$('#tools'),c=$('#content');tools.replaceChildren();c.replaceChildren();const title=$('#title'),intro=$('#intro');const grid=element('div',undefined,'grid');c.append(grid);
if(path.length===0){title.textContent='학교급을 선택해 주세요';intro.textContent='학교급 → 학년 → 교과 → 단원 → 의사소통카드';stages.forEach(([s,n])=>grid.append(tile(s,'1학년 ~ '+n+'학년',()=>navigate(s))))}
if(path.length===1){title.textContent=path[0]+' · 학년 선택';intro.textContent='수업할 학년을 선택해 주세요.';for(let n=1;n<=stages.find(s=>s[0]===path[0])[1];n++)grid.append(tile(n+'학년','교과 보기',()=>navigate(n)))}
if(path.length===2){title.textContent=path[0]+' '+path[1]+'학년 · 교과';intro.textContent=path[0]==='초등'?'필요한 교과를 선택하세요. 교과는 추가할 수 있습니다.':'해당 학년의 교과를 직접 등록해 주세요.';subjects().forEach(s=>grid.append(tile(s,'단원 보기',()=>navigate(s))));tools.append(btn('+ 교과 추가',addSubject));if(!subjects().length)c.append(element('div','아직 등록된 교과가 없습니다. 위의 ‘교과 추가’를 눌러 주세요.','empty'))}
if(path.length===3){title.textContent=path[2]+' · 단원';intro.textContent='실제 교과서에 맞춰 단원을 추가하고 카드 이미지를 등록하세요.';currentUnits().forEach(u=>grid.append(tile(u.name,state.cards.filter(c=>c.unit===u.id).length+'장의 카드',()=>navigate(u.id))));tools.append(btn('+ 단원 추가',addUnit));if(!currentUnits().length)c.append(element('div','등록된 단원이 없습니다. ‘단원 추가’부터 시작하세요.','empty'))}
if(path.length===4){title.textContent=state.units.find(u=>u.id===path[3])?.name||'단원';intro.textContent=manage?'카드 이름을 수정하거나 필요 없는 카드를 삭제할 수 있습니다.':mode==='tablet'?'카드를 누르면 선택한 말이 아래에 크게 나타납니다.':'필요한 카드를 눌러 인쇄함에 담으세요.';const switches=element('div',undefined,'row');switches.append(btn('태블릿으로 사용',()=>{mode='tablet';manage=false;render()},mode==='tablet'&&!manage?'primary':''),btn('인쇄할 카드 선택',()=>{mode='print';manage=false;render()},mode==='print'&&!manage?'primary':''));const ops=element('div',undefined,'row');ops.append(btn('+ 카드 추가',addCards),btn('카드 관리',()=>{manage=!manage;render()}),btn('단원 이름 수정',renameUnit));tools.append(switches,ops);if(mode==='print'&&!manage){tools.append(btn('이 단원 모두 담기',()=>{currentCards().forEach(x=>selected.add(x.id));render()}))}currentCards().forEach(card=>{if(manage){const box=element('div',undefined,'panel');box.append(cardButton(card),btn('이름 수정',()=>renameCard(card)),btn('삭제',()=>deleteCard(card),'danger'));grid.append(box)}else grid.append(cardButton(card))});if(!currentCards().length)c.append(element('div','카드를 추가해 주세요. 개별 카드 이미지 여러 장을 한 번에 등록하거나 글자 카드부터 만들 수 있습니다.','empty'));const response=element('div','카드를 선택해 주세요.','response');response.id='response';response.setAttribute('aria-live','polite');if(mode!=='tablet'||manage)response.hidden=true;c.append(response)}
if(!teacher){if(path.length===3)intro.textContent='수업할 단원을 선택해 주세요.';if(path.length===2)intro.textContent='수업할 교과를 선택해 주세요.';[...tools.querySelectorAll('button')].filter(b=>['+ 교과 추가','+ 단원 추가','+ 카드 추가','카드 관리','단원 이름 수정'].includes(b.textContent)).forEach(b=>b.remove());if(path.length===2&&!subjects().length||path.length===3&&!currentUnits().length||path.length===4&&!currentCards().length){const blank=c.querySelector('.empty');if(blank)blank.textContent='아직 게시된 공통 자료가 없습니다. 담당 교사가 자료를 게시하면 여기에 표시됩니다.'}}
}
function cardButton(card){const b=btn('',()=>{if(manage)return;if(mode==='print'){selected.has(card.id)?selected.delete(card.id):selected.add(card.id);b.setAttribute('aria-pressed',String(selected.has(card.id)));$('#basket b').textContent=selected.size}else{$('#response').textContent=card.name}},'tile vocab');b.setAttribute('aria-label',card.name);if(mode==='print'&&!manage)b.setAttribute('aria-pressed',String(selected.has(card.id)));if(card.image){const img=new Image();img.src=card.image;img.alt='';b.append(img,element('strong',card.name))}else b.append(element('span',card.name,'wordonly'));return b}
function formDialog(title,build,save){const d=$('#dialog');d.replaceChildren();const f=element('form');f.append(element('h2',title));build(f);const a=element('div',undefined,'actions');a.append(btn('취소',()=>d.close()));const submit=element('button','저장','primary');submit.type='submit';a.append(submit);f.append(a);f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await save(new FormData(f));d.close()}catch(err){notify(err.message,true);submit.disabled=false}};d.append(f);d.showModal();return d}
function field(f,label,name,value='',type='text'){const l=element('label',label);const input=document.createElement('input');input.name=name;input.type=type;input.value=value;input.required=true;l.append(input);f.append(l);return input}
function addSubject(){formDialog('교과 추가',f=>field(f,'교과 이름','name'),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('교과 이름을 입력해 주세요.');if(subjects().includes(name))throw Error('이미 있는 교과입니다.');await commit({...state,subjects:[...state.subjects,{stage:path[0],grade:path[1],name}]})})}
function addUnit(){formDialog('단원 추가',f=>field(f,'단원 이름 (예: 1. 시간 경험하기)','name'),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('단원 이름을 입력해 주세요.');await commit({...state,units:[...state.units,{id:id(),stage:path[0],grade:path[1],subject:path[2],name}]})})}
function renameUnit(){const u=state.units.find(u=>u.id===path[3]);formDialog('단원 이름 수정',f=>field(f,'단원 이름','name',u.name),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('이름을 입력해 주세요.');await commit({...state,units:state.units.map(x=>x.id===u.id?{...x,name}:x)})})}
function renameCard(card){formDialog('카드 이름 수정',f=>field(f,'카드 이름','name',card.name),async fd=>{const name=String(fd.get('name')).trim();if(!name)throw Error('이름을 입력해 주세요.');await commit({...state,cards:state.cards.map(x=>x.id===card.id?{...x,name}:x)})})}
async function deleteCard(card){if(!confirm('‘'+card.name+'’ 카드를 삭제할까요?'))return;await commit({...state,cards:state.cards.filter(x=>x.id!==card.id)});selected.delete(card.id);render()}
function loadImage(file){return new Promise((resolve,reject)=>{if(!['image/png','image/jpeg','image/webp'].includes(file.type)){reject(Error('PNG, JPG, WEBP 이미지로 등록해 주세요.'));return}if(file.size>20*1024*1024){reject(Error('한 이미지의 크기는 20MB 이하로 해 주세요.'));return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const k=Math.min(1,1000/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/png'))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지를 읽을 수 없습니다.'))};img.src=url})}
function addCards(){let files;formDialog('이 단원에 카드 추가',f=>{f.append(element('p','개별 카드 이미지 파일을 선택하세요. 파일명이 카드 이름이 됩니다. 여러 카드가 붙어 있는 한 장의 이미지는 먼저 카드별로 나누어 주세요.','help'));files=field(f,'이미지 파일 (여러 장 선택 가능)','files','','file');files.multiple=true;files.accept='image/png,image/jpeg,image/webp';files.required=false;const name=field(f,'카드 이름 (이미지 없이 글자 카드 생성 / 이미지 1장일 때 이름 지정)','name');name.required=false},async fd=>{const list=[...files.files],name=String(fd.get('name')).trim();if(!list.length&&!name)throw Error('이미지를 선택하거나 카드 이름을 입력해 주세요.');const added=[];for(const file of list){added.push({id:id(),unit:path[3],name:list.length===1&&name?name:file.name.replace(/\.[^.]+$/,''),image:await loadImage(file)})}if(!list.length)added.push({id:id(),unit:path[3],name,image:''});await commit({...state,cards:[...state.cards,...added]})})}
function chosen(){return state.cards.filter(c=>selected.has(c.id))}
function sheet(cards,size,labels,layout){const sheet=element('div',undefined,'printsheet');if(layout==='board'){const title=element('h2','나의 의사소통판');title.style.width='100%';sheet.append(title)}cards.forEach(card=>{const item=element('div',undefined,'printcard'+(!labels?' nolabel':''));item.style.width=size+'mm';item.style.height=size+'mm';if(card.image){const img=new Image();img.src=card.image;img.alt=card.name;item.append(img)}if(labels||!card.image)item.append(element('span',card.name));sheet.append(item)});return sheet}
function printDialog(){const d=$('#dialog');d.replaceChildren();d.append(element('h2','인쇄함 · '+chosen().length+'장'));const config=element('div',undefined,'row');const size=document.createElement('select');size.setAttribute('aria-label','카드 크기');[40,50,60,80].forEach(n=>{const o=element('option',n/10+' × '+n/10+'cm');o.value=n;size.append(o)});size.value=50;const layout=document.createElement('select');layout.setAttribute('aria-label','인쇄 형태');[['cards','낱장 카드'],['board','의사소통판']].forEach(([v,t])=>{const o=element('option',t);o.value=v;layout.append(o)});const label=element('label',' 카드 이름 표시');const labels=document.createElement('input');labels.type='checkbox';labels.checked=true;label.prepend(labels);config.append(size,layout,label);d.append(config,element('p','A4 세로 · 인쇄 배율 100% / 실제 크기 · 브라우저 머리글·바닥글 해제. 원본 그림에 포함된 글자는 숨겨지지 않습니다.','help'));const wrap=element('div',undefined,'previewwrap');function update(){wrap.replaceChildren(sheet(chosen(),Number(size.value),labels.checked,layout.value))}size.onchange=layout.onchange=labels.onchange=update;update();d.append(wrap);const actions=element('div',undefined,'actions');actions.append(btn('선택 비우기',()=>{selected.clear();d.close();render()}),btn('닫기',()=>d.close()),btn('인쇄 / PDF 저장',async()=>{if(!chosen().length){notify('인쇄할 카드를 먼저 선택해 주세요.',true);return}const area=$('#print-area');area.replaceChildren(sheet(chosen(),Number(size.value),labels.checked,layout.value));await Promise.all([...area.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));d.close();window.print()},'primary'));d.append(actions);d.showModal()}
function download(name,text){const blob=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validateBackup(x){if(!x||x.schema!==1||!Array.isArray(x.subjects)||!Array.isArray(x.units)||!Array.isArray(x.cards))throw Error('이 앱의 백업 파일이 아닙니다.');const stageOK=(s,g)=>stages.some(v=>v[0]===s&&Number.isInteger(g)&&g>=1&&g<=v[1]);if(x.subjects.some(s=>!stageOK(s.stage,s.grade)||typeof s.name!=='string'||!s.name.trim())||x.units.some(u=>!stageOK(u.stage,u.grade)||typeof u.id!=='string'||typeof u.name!=='string'||typeof u.subject!=='string'))throw Error('교과·단원 정보가 잘못된 파일입니다.');const ids=new Set(x.units.map(u=>u.id));if(ids.size!==x.units.length||new Set(x.cards.map(c=>c.id)).size!==x.cards.length||x.cards.some(c=>typeof c.id!=='string'||typeof c.name!=='string'||!ids.has(c.unit)||typeof c.image!=='string'||(c.image&&!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(c.image))))throw Error('카드 정보가 잘못된 파일입니다.');return x}

function readKey(key){return new Promise((resolve,reject)=>{const q=db.transaction('data').objectStore('data').get(key);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function writeKey(key,value){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('저장 실패'))})}
async function syncCommon(){if(syncing)return;syncing=true;$('#sync').disabled=true;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);try{const res=await fetch('./common.json?update='+Date.now(),{cache:'no-store',signal:controller.signal});if(!res.ok)throw Error('공통 자료 응답 오류 '+res.status);const pack=validateBackup(await res.json());await writeKey('common',pack);commonData=pack;if(!teacher){state=commonData;if(path.length===4&&!state.units.some(u=>u.id===path[3]))path=path.slice(0,3);const ids=new Set(state.cards.map(c=>c.id));selected=new Set([...selected].filter(x=>ids.has(x)));render()}notify('공통 자료 확인 완료 · '+pack.cards.length+'장 · '+(pack.revision||'초기 자료')+(teacher?' · 제작 중인 작업은 그대로 유지됩니다.':''))}catch(e){notify('최신 자료를 받지 못했습니다. 마지막 저장 자료를 사용합니다. '+(teacher?'제작 작업은 유지됩니다. ':'')+'('+e.message+')')}finally{clearTimeout(timeout);syncing=false;$('#sync').disabled=false}}
async function toggleTeacher(){if(!teacher){if(!localDraft){localDraft=JSON.parse(JSON.stringify(commonData));await writeKey('draft',localDraft)}teacher=true;state=localDraft;notify('자료 제작 모드 · 작업은 이 컴퓨터에만 저장됩니다. 게시·백업에서 common.json을 내려받아 GitHub에 올려 주세요.')}else{teacher=false;state=commonData;notify('학교 공통 자료 화면입니다.')}path=[];manage=false;selected.clear();render()}
function publishFile(){if(!teacher)throw Error('자료 제작 모드로 전환해 주세요.');const pack={schema:1,revision:new Date().toISOString(),subjects:state.subjects,units:state.units,cards:state.cards};validateBackup(pack);download('common.json',JSON.stringify(pack));notify('common.json을 저장했습니다. GitHub school-aac 저장소의 같은 파일을 교체하고 Commit changes를 눌러야 게시됩니다.')}
function dataDialog(){const d=$('#dialog');d.replaceChildren();d.append(element('h2',teacher?'학교 공통자료 게시·백업':'학교 공통자료 사용안내'));d.append(element('p','교사용 앱은 실행할 때와 ‘최신 자료 받기’를 누를 때 GitHub의 common.json을 확인합니다. 게시가 완료된 새 자료는 앱 재설치 없이 반영되며, 인터넷이 없으면 마지막으로 저장한 공통 자료를 사용합니다.'));if(teacher){d.append(element('p','① 자료 제작 → ② common.json 저장 → ③ GitHub 저장소에서 common.json 교체 → ④ Commit changes. GitHub 게시가 끝난 뒤 공통자료로 돌아가 최신 자료를 받아 확인하세요. 다른 교사들은 파일을 교체하거나 앱을 재설치할 필요가 없습니다.','help'),btn('공통자료 common.json 저장',publishFile,'primary'));const a=document.createElement('a');a.href='https://github.com/juyoung-kim76/school-aac';a.target='_blank';a.rel='noopener';a.textContent='GitHub 저장소 열기';a.style.display='block';a.style.marginTop='16px';d.append(a,element('p','이 저장소는 공개용입니다. 학생 사진·이름 등 개인정보는 게시하지 마세요. 이 화면의 제작 모드는 로그인 기능이 아니며 실제 게시 권한은 GitHub에서 관리합니다.','help'),btn('제작 작업 백업',()=>download('AAC_제작백업.json',JSON.stringify(state))));const l=element('label','백업 JSON 불러오기 (현재 제작 작업을 교체)');const input=document.createElement('input');input.type='file';input.accept='.json,application/json';l.append(input);d.append(l);input.onchange=async()=>{try{if(!input.files[0])return;const pack=validateBackup(JSON.parse(await input.files[0].text()));if(!confirm('현재 제작 작업을 선택한 자료로 교체할까요? 필요한 작업은 먼저 백업하세요.'))return;await commit(pack);path=[];selected.clear();render();d.close()}catch(e){notify(e.message,true)}};d.append(btn('게시된 공통자료로 제작 작업 다시 시작',async()=>{if(!confirm('현재 제작 작업을 최신 저장된 공통자료로 교체할까요? 기존 제작 작업은 먼저 백업하세요.'))return;await commit(JSON.parse(JSON.stringify(commonData)));path=[];selected.clear();render();d.close()}));}else{d.append(element('p','설치: Edge 또는 Chrome에서 이 사이트를 연 뒤 ‘앱 설치’ 버튼 또는 브라우저의 앱 설치 메뉴를 사용하세요. 최초 실행은 인터넷 연결이 필요합니다. 상단 상태에 ‘오프라인 앱 준비 완료’가 표시된 뒤 앱을 닫고 다시 열어 확인하세요.','help'));}const actions=element('div',undefined,'actions');actions.append(btn('닫기',()=>d.close()));d.append(actions);d.showModal()}
$('#back').onclick=()=>{if(!path.length)return;path.pop();manage=false;render()};
$('#home').onclick=()=>{path=[];manage=false;render()};$('#basket').onclick=printDialog;$('#data').onclick=dataDialog;

$('#sync').onclick=syncCommon;$('#teacher').onclick=()=>toggleTeacher().catch(e=>notify(e.message,true));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(installPrompt){await installPrompt.prompt();installPrompt=null;$('#install').hidden=true}};
$('#refresh').onclick=()=>location.reload();
window.addEventListener('appinstalled',()=>{$('#install').hidden=true;notify('앱이 설치되었습니다.')});
async function setupOffline(){if(!('serviceWorker' in navigator))return;try{const reg=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;notify('오프라인 앱 준비 완료 · 학교 공통 자료 '+commonData.cards.length+'장');reg.update().catch(()=>{});let controlled=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled){$('#refresh').hidden=false;notify('앱 새 버전이 준비되었습니다. 작업 저장 후 앱 업데이트를 눌러 주세요.')}controlled=true})}catch(e){notify('오프라인 앱 준비 실패. 인터넷 연결 상태에서 새로고침해 주세요. ('+e.message+')',true)}}
(async()=>{try{db=await openDB();commonData=await readKey('common')||initial();validateBackup(commonData);localDraft=await readKey('draft')||null;if(localDraft)validateBackup(localDraft);state=commonData;render();await syncCommon();setupOffline()}catch(e){notify('자료 저장소를 열지 못했습니다. Edge 또는 Chrome 일반 창에서 열어 주세요. '+e.message,true)}})();
</script></body></html>
